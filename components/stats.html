<div class="container" data-aos="fade-up">
  <h2 class="section-title">
    <i class="fas fa-chart-line"></i> GitHub & LeetCode Stats
  </h2>

  <!-- GitHub Overview Cards -->
  <div class="row mb-4">
    <div class="col-12">
      <h3 style="color: var(--accent-color); margin-bottom: 20px;">
        <i class="fab fa-github"></i> GitHub Overview
      </h3>
    </div>
    <div id="github-stats-container" class="col-12">
      <div style="text-align: center; padding: 40px;">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent-color);"></i>
        <p style="color: #cbd5e1; margin-top: 10px;">Loading GitHub stats...</p>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- Languages Used -->
    <div class="col-lg-6 mb-4">
      <div class="glass-card">
        <h3 style="color: var(--accent-color); margin-bottom: 20px;">
          <i class="fas fa-code"></i> Most Used Languages
        </h3>
        <div id="languages-container">
          <div style="text-align: center; padding: 30px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--accent-color);"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- LeetCode Stats -->
    <div class="col-lg-6 mb-4">
      <div class="glass-card">
        <h3 style="color: var(--accent-color); margin-bottom: 20px;">
          <i class="fas fa-brain"></i> LeetCode Progress
        </h3>
        <div id="leetcode-stats-container">
          <div style="text-align: center; padding: 30px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--accent-color);"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Top Repositories -->
  <div class="row">
    <div class="col-12 mb-4">
      <div class="glass-card">
        <h3 style="color: var(--accent-color); margin-bottom: 25px;">
          <i class="fas fa-star"></i> Top Repositories
        </h3>
        <div id="top-repos-container">
          <div style="text-align: center; padding: 30px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--accent-color);"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
